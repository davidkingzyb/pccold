name: Build and Release Clojure App

on:
  push:
    branches:
      - master  # 或你希望触发 workflow 的分支

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Leiningen
        uses: DeLaGuardo/setup-clojure@11.0
        with:
          lein: latest

      - name: Install rlwrap
        run: sudo apt-get install -y rlwrap

      - name: Build with Figwheel
        run: rlwrap lein do clean, figwheel

      - name: Create release archive
        run: |
          mkdir -p build
          zip -r build/clojure-app.zip . -x ".git/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: build/clojure-app.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
